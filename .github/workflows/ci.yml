name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Set up Protocol Buffers
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"

      - name: Install protobuf generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.35.1
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1

      - name: Generate protobuf code
        run: |
          protoc \
            --go_out=. \
            --go_opt=module=github.com/likhitha281/forge \
            --go-grpc_out=. \
            --go-grpc_opt=module=github.com/likhitha281/forge \
            proto/forge.proto

      - name: Verify formatting
        run: |
          test -z "$(gofmt -l ./cmd ./internal ./gen)"

      - name: Verify dependencies
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Run race detector
        run: go test -race ./...

      - name: Build packages
        run: go build ./...

      - name: Build coordinator Docker image
        run: docker build --build-arg TARGET=coordinator -t forge-coordinator:test .

      - name: Build worker Docker image
        run: docker build --build-arg TARGET=worker -t forge-worker:test .