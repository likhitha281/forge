services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge"]
      interval: 3s
      timeout: 3s
      retries: 20

  coordinator:
    build:
      context: .
      args:
        TARGET: coordinator
    environment:
      DATABASE_URL: "postgres://forge:forge@postgres:5432/forge?sslmode=disable"
    ports:
      - "50051:50051"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      args:
        TARGET: worker
    environment:
      FORGE_ADDR: "coordinator:50051"
      WORKER_CAPACITY: "4"
      WORKER_CPU_CORES: "8"
      WORKER_MEMORY_MB: "16384"
      WORKER_GPUS: "2"
    depends_on:
      - coordinator

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"

  grafana:
    image: grafana/grafana:11.2.2
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro