apiVersion: v1
kind: Secret
metadata: {name: forge-db}
type: Opaque
stringData: {DATABASE_URL: "postgres://forge:forge@postgres:5432/forge?sslmode=disable"}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: coordinator}
spec:
  replicas: 1
  selector: {matchLabels: {app: coordinator}}
  template:
    metadata: {labels: {app: coordinator}}
    spec:
      containers:
        - name: coordinator
          image: ghcr.io/likhitha281/forge-coordinator:latest
          ports: [{containerPort: 50051}, {containerPort: 9090}]
          envFrom: [{secretRef: {name: forge-db}}]
          readinessProbe: {tcpSocket: {port: 50051}, initialDelaySeconds: 3, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: coordinator}
spec: {selector: {app: coordinator}, ports: [{name: grpc, port: 50051, targetPort: 50051}, {name: metrics, port: 9090, targetPort: 9090}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker}
spec:
  replicas: 3
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      containers:
        - name: worker
          image: ghcr.io/likhitha281/forge-worker:latest
          env: [{name: FORGE_ADDR, value: "coordinator:50051"}, {name: WORKER_ID, valueFrom: {fieldRef: {fieldPath: metadata.name}}}, {name: WORKER_CAPACITY, value: "4"}]
